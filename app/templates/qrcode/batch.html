{% extends "base.html" %}

{% block title %}批量生成 - 二维码生成系统{% endblock %}

{% block content %}
<div class="qrcode-batch-section">
    <h1>批量生成二维码</h1>
    
    <form method="POST" action="{{ url_for('qrcode.batch') }}" enctype="multipart/form-data" class="qrcode-form">
        <div class="form-group">
            <label for="content_text">输入内容 (每行一个)</label>
            <textarea id="content_text" name="content_text" rows="10" placeholder="每行一个内容,例如:
https://example.com
联系我们
13800138000
info@example.com"></textarea>
        </div>
        
        <div class="form-group">
            <label>或者上传文件</label>
            <input type="file" name="file" accept=".txt,.csv">
            <small>支持.txt和.csv文件,每行一个内容</small>
        </div>
        
        <hr>
        
        <h3>样式设置</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label for="box_size">格子大小</label>
                <input type="number" id="box_size" name="box_size" value="10" min="1" max="50">
            </div>
            
            <div class="form-group">
                <label for="border">边框大小</label>
                <input type="number" id="border" name="border" value="4" min="0" max="20">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="fill_color">前景色</label>
                <input type="color" id="fill_color" name="fill_color" value="#000000">
            </div>
            
            <div class="form-group">
                <label for="back_color">背景色</label>
                <input type="color" id="back_color" name="back_color" value="#ffffff">
            </div>
        </div>
        
        <div class="form-group">
            <label for="error_correction">纠错级别</label>
            <select id="error_correction" name="error_correction">
                <option value="L">L - 7% 纠错</option>
                <option value="M" selected>M - 15% 纠错 (推荐)</option>
                <option value="Q">Q - 25% 纠错</option>
                <option value="H">H - 30% 纠错</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-large">批量生成</button>
    </form>
</div>
{% endblock %}
